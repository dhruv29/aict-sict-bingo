<style>

/* Layout: one-screen phone card — header, 5x5 board filling width, sticky action bar. Dark keynote-hall look by design. */
:root{

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 60% at 50% -10%, #1d3a5c 0%, transparent 60%);}
.wrap{max-width:560px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:14px 96px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.event{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.5}
.event b{display:block;color:var(--green);font-weight:700}

.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

.letters div.on{background:var(--green);color:#0b1726}
.status{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.cell{position:relative;aspect-ratio:1/1.12;max-width:100%;border:0;border-radius:9px;background:var(--tile);color:var(--tile-ink);

  text-align:center;cursor:pointer;transition:transform .12s, background .2s, color .2s;min-width:0;overflow:hidden}
.cell b{font-weight:700}
.cell svg{width:clamp(16px,5vw,26px);height:auto;flex:none;stroke:var(--tile-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cell svg .g{fill:var(--green);stroke:var(--tile-ink)}
.cell:active{transform:scale(.95)}
.cell:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.cell.marked{background:var(--green-deep);color:#fff}
.cell.marked svg{stroke:#fff}
.cell.marked svg .g{fill:#fff;stroke:#fff}
.cell.marked::after{content:"";position:absolute;inset:6%;border:3px solid rgba(255,255,255,.85);border-radius:50%;transform:rotate(-8deg);pointer-events:none;animation:stamp .25s ease-out}
.cell.win{background:var(--green);color:#0b1726;box-shadow:0 0 0 2px #fff inset}
.cell.win svg{stroke:#0b1726}.cell.win svg .g{fill:#0b1726;stroke:#0b1726}
.cell.win::after{border-color:#0b1726}
.cell.free{background:var(--green);color:#0b1726}
.cell.free::after{display:none}
.cell.free b{font-family:var(--display);font-size:1.05em}
@keyframes stamp{from{transform:scale(1.4) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(11,23,38,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
button.btn{flex:1;font:700 14px var(--body);border-radius:12px;padding:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.btn.primary{background:var(--green);border-color:var(--green);color:#0b1726}
button.btn:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.confirm{display:flex;gap:8px;align-items:center;flex:1}
.confirm span{font-size:13px;color:var(--muted);flex:1}
.toast{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,12,20,.7);z-index:20;padding:24px}
.toast .card{background:var(--panel);border:2px solid var(--green);border-radius:18px;padding:24px 22px;text-align:center;max-width:320px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.toast h2{font-family:var(--display);font-size:44px;margin:0;color:var(--green);letter-spacing:.06em}
.toast p{margin:8px 0 18px;color:var(--muted);line-height:1.45}
@keyframes pop{from{transform:scale(.6);opacity:0}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:30}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 ['Use the term <b>“platform for AI agents”</b>','cloud'],
 ['<b>Compare AICT vs SICT</b> (or rebranding)','sync'],
 ['Mention <b>partner ecosystem</b>','hands'],
 ['Say <b>“the future of work”</b>','bulb'],
 ['Audience <b>Q&amp;A mentions AI</b>','q'],
 ['Talk about <b>measurable ROI</b>','roi'],
 ['Use the term <b>“cross-functional collaboration”</b>','team']
];
const FREE=12, KEY='aict-sict-bingo-v1';
const LINES=[];
for(let i=0;i<5;i++){LINES.push([0,1,2,3,4].map(j=>i*5+j));LINES.push([0,1,2,3,4].map(j=>j*5+i));}
LINES.push([0,6,12,18,24],[4,8,12,16,20]);

let state={order:[...Array(25).keys()],marked:Array(25).fill(false),seen:0};
try{const s=JSON.parse(window.localStorage.getItem(KEY));if(s&&Array.isArray(s.order)&&s.order.length===25&&Array.isArray(s.marked)&&s.marked.length===25)state=s;}catch(e){}
state.marked[FREE]=true;
const save=()=>{try{window.localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};

const board=document.getElementById('board');
function render(){
  board.innerHTML='';
  const wins=winLines(), winCells=new Set(wins.flat());
  state.order.forEach((sq,pos)=>{
    const b=document.createElement('button');
    b.className='cell';b.id='cell-'+pos;b.setAttribute('role','gridcell');
    if(sq===FREE){
      b.classList.add('free');
      b.innerHTML='<svg viewBox="0 0 24 24">'+I.freestar+'</svg><b>FREE</b><span>“AI” twice on one slide</span>';
      b.setAttribute('aria-label','Free space');
    }else{
      const [t,ic]=SQUARES[sq];
      b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+I[ic]+'</svg><span>'+t+'</span>';
      b.setAttribute('aria-pressed',state.marked[pos]);
      if(state.marked[pos])b.classList.add('marked');
      if(winCells.has(pos))b.classList.add('win');
      b.onclick=()=>toggle(pos);
    }
    board.appendChild(b);
  });
  document.getElementById('count').textContent=state.marked.filter(Boolean).length;
  document.getElementById('lines').textContent=wins.length;
  [...document.getElementById('letters').children].forEach((d,i)=>d.classList.toggle('on',i<wins.length));
}
function winLines(){return LINES.filter(l=>l.every(p=>state.marked[p]));}
function toggle(pos){
  state.marked[pos]=!state.marked[pos];
  if(navigator.vibrate)try{navigator.vibrate(state.marked[pos]?15:0)}catch(e){}
  const n=winLines().length;
  if(n>state.seen){celebrate(n)}
  state.seen=n;save();render();
}
function celebrate(n){
  const msg=n>=12?'Blackout! Every square on the board.':n===1?'First line complete. Shout it out!':n+' lines and counting.';
  document.getElementById('toastMsg').textContent=msg;
  document.getElementById('toast').hidden=false;confetti();
}
document.getElementById('toastClose').onclick=()=>document.getElementById('toast').hidden=true;

const barIn=document.getElementById('barIn');
function bar(mode){
  if(mode==='confirm'){
    barIn.innerHTML='<div class="confirm"><span>Clear all marks?</span><button class="btn" id="no">Cancel</button><button class="btn primary" id="yes">Clear</button></div>';
    document.getElementById('no').onclick=()=>bar();
    document.getElementById('yes').onclick=()=>{state.marked=Array(25).fill(false);state.marked[FREE]=true;state.seen=0;save();render();bar();};
  }else{
    barIn.innerHTML='<button class="btn" id="shuffle">Shuffle board</button><button class="btn" id="reset">New game</button>';
    document.getElementById('shuffle').onclick=()=>{
      const rest=[...Array(25).keys()].filter(i=>i!==FREE);
      for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
      rest.splice(FREE,0,FREE);state.order=rest;state.marked=Array(25).fill(false);state.marked[FREE]=true;state.seen=0;save();render();
    };
    document.getElementById('reset').onclick=()=>bar('confirm');
  }
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('fx'),x=c.getContext('2d');
  c.width=innerWidth;c.height=innerHeight;
  const cols=['#7ee36b','#ffffff','#3aa62a','#c9f5bf'];
  const ps=Array.from({length:140},()=>({x:c.width/2,y:c.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:4+Math.random()*5,r:Math.random()*6,c:cols[Math.random()*4|0]}));
  let f=0;(function tick(){
    x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height);
  })();
}
function start(){try{render();}catch(e){console.error(e);}try{bar();}catch(e){console.error(e);}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
</script>
</body>
</html>
